; WDForceStereo v1.2 configuration
; Put this file next to watch_dogs.exe and dinput8.dll.
; Values are read when Watch Dogs starts, so restart the game after editing.
;
; All gains are LINEAR coefficients, not dB.
; 0.000 = muted
; 0.500 = -6.0 dB
; 0.707 = -3.0 dB
; 1.000 =  0.0 dB
; 1.414 = +3.0 dB
; 2.000 = +6.0 dB
;
; Both decimal point and decimal comma are accepted.

[Audio]
; Scales the game's existing Front Left / Front Right routing.
FrontGain=1.000

; Sends Front Center (dialogue) to BOTH L and R.
; v0.9 used 0.707. v1.1 defaulted to 1.000.
CenterGain=1.000

; Sends Back Left to L and Back Right to R.
; 0.000 preserves the v1.1 sound. 0.707 is a conventional starting point
; if you want the discarded rear ambience folded into stereo.
SurroundGain=0.000

; Sends LFE equally to L and R.
; 0.000 preserves the v1.1 sound. 0.500 is a cautious starting point.
LFEGain=0.000

; Final multiplier applied to the complete stereo matrix.
; Values above 1.000 can increase clipping risk.
MasterGain=1.000

[Debug]
; 1 = create/update WDForceStereo.log
; 0 = disable logging
Log=1
