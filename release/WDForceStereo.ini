; WDForceStereo configuration
; Put this file next to watch_dogs.exe and your chosen WDForceStereo loader.
; If this file is missing, WDForceStereo recreates it automatically with defaults.
; Values are read when Watch Dogs starts, so restart the game after editing.
;
; All gains are LINEAR coefficients, not dB.
; 0.000 = muted
; 0.500 = -6.0 dB
; 0.707 = -3.0 dB
; 1.000 =  0.0 dB
; 1.414 = +3.0 dB
; 2.000 = +6.0 dB
;
; Both decimal point and decimal comma are accepted.

[Audio]
; Scales the game's existing Front Left / Front Right routing.
FrontGain=1.000

; Sends Front Center (dialogue) to BOTH L and R.
; Slightly boosts center-channel dialogue before the final global multiplier.
CenterGain=1.250

; Sends Back Left to L and Back Right to R.
; Keeps rear-channel audio, including voices positioned behind the camera.
; 0.000 mutes the rear channels.
SurroundGain=0.707

; Sends LFE equally to L and R.
; Includes the LFE channel at a reduced level.
LFEGain=0.500

; Final multiplier applied to the complete stereo matrix.
; Values above 1.000 can increase clipping risk.
MasterGain=0.900

[Debug]
; 1 = create/update WDForceStereo.log
; 0 = disable logging
Log=1
