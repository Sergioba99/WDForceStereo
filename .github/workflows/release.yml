name: Build WDForceStereo Draft Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version/tag (for example v1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ inputs.version }}'
          } else {
            $tag = '${{ github.ref_name }}'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Stamp build identity
        shell: pwsh
        run: |
          $id = (git rev-parse --short HEAD).Trim()
          $version = '${{ steps.version.outputs.version }}'
          @"
          #ifndef WD_FORCE_STEREO_BUILD_H
          #define WD_FORCE_STEREO_BUILD_H
          #define WD_VERSION "$version"
          #define WD_BUILD_ID "$id"
          #endif
          "@ | Out-File -Encoding ascii src\wd_build.h
          Write-Host "WDForceStereo v$version build: $id"

      - name: Build kernel32 import library
        shell: pwsh
        run: lld-link /lib /machine:x64 /def:kernel32.def /out:kernel32.lib

      - name: Compile shared core
        shell: pwsh
        run: >-
          clang --target=x86_64-pc-windows-msvc -c src/wd_core.c
          -o wd_core.obj -O2 -ffreestanding -fno-builtin
          -fno-stack-protector -Wno-incompatible-library-redeclaration

      - name: Compile loader layers
        shell: pwsh
        run: |
          clang --target=x86_64-pc-windows-msvc -c src/dinput8_proxy.c -o dinput8_proxy.obj -O2 -ffreestanding -fno-builtin -fno-stack-protector -Wno-incompatible-library-redeclaration
          clang --target=x86_64-pc-windows-msvc -c src/winmm_proxy.c -o winmm_proxy.obj -O2 -ffreestanding -fno-builtin -fno-stack-protector -Wno-incompatible-library-redeclaration
          clang --target=x86_64-pc-windows-msvc -c src/asi_entry.c -o asi_entry.obj -O2 -ffreestanding -fno-builtin -fno-stack-protector -Wno-incompatible-library-redeclaration

      - name: Link release binaries
        shell: pwsh
        run: |
          lld-link /dll /machine:x64 /entry:DllMain /nodefaultlib /opt:ref wd_core.obj dinput8_proxy.obj kernel32.lib /def:src/dinput8_exports.def /out:dinput8.dll
          lld-link /dll /machine:x64 /entry:DllMain /nodefaultlib /opt:ref wd_core.obj winmm_proxy.obj kernel32.lib /def:src/winmm_exports.def /out:winmm.dll
          lld-link /dll /machine:x64 /entry:DllMain /nodefaultlib /opt:ref wd_core.obj asi_entry.obj kernel32.lib /out:WDForceStereo.asi

      - name: Stage release package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $folder = "WDForceStereo-v$version"
          $zip = "WDForceStereo-v$version.zip"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item .\dinput8.dll "$folder\dinput8.dll"
          Copy-Item .\winmm.dll "$folder\winmm.dll"
          Copy-Item .\WDForceStereo.asi "$folder\WDForceStereo.asi"
          Copy-Item .\release\WDForceStereo.ini "$folder\WDForceStereo.ini"
          Copy-Item .\release\INSTALL.txt "$folder\INSTALL.txt"
          Compress-Archive -Path "$folder\*" -DestinationPath $zip -Force

          $checksums = @(
            "{0}  dinput8.dll" -f (Get-FileHash .\dinput8.dll -Algorithm SHA256).Hash.ToLower()
            "{0}  winmm.dll" -f (Get-FileHash .\winmm.dll -Algorithm SHA256).Hash.ToLower()
            "{0}  WDForceStereo.asi" -f (Get-FileHash .\WDForceStereo.asi -Algorithm SHA256).Hash.ToLower()
            "{0}  WDForceStereo.ini" -f (Get-FileHash .\release\WDForceStereo.ini -Algorithm SHA256).Hash.ToLower()
            "{0}  INSTALL.txt" -f (Get-FileHash .\release\INSTALL.txt -Algorithm SHA256).Hash.ToLower()
            "{0}  $zip" -f (Get-FileHash ".\$zip" -Algorithm SHA256).Hash.ToLower()
          )
          $checksums | Set-Content -Encoding ascii .\SHA256SUMS.txt
          Get-Content .\SHA256SUMS.txt

      - name: Create or update private draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $version = '${{ steps.version.outputs.version }}'
          $zip = ".\WDForceStereo-v$version.zip"
          $assets = @(
            "$zip#WDForceStereo v$version",
            ".\SHA256SUMS.txt#SHA-256 checksums"
          )

          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; forcing draft status and replacing assets with ZIP + SHA256SUMS.txt."
            gh release edit $tag --repo '${{ github.repository }}' --draft
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $existingAssets = gh release view $tag --repo '${{ github.repository }}' --json assets --jq '.assets[].name'
            foreach ($existingAsset in $existingAssets) {
              if ($existingAsset) {
                gh release delete-asset $tag $existingAsset --repo '${{ github.repository }}' --yes
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }
            }
            gh release upload $tag @assets --repo '${{ github.repository }}'
            exit $LASTEXITCODE
          }

          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tag $tag already exists; creating a private draft release from the existing tag."
            gh release create $tag @assets --repo '${{ github.repository }}' --verify-tag --title "WDForceStereo v$version" --generate-notes --draft
            exit $LASTEXITCODE
          }

          Write-Host "Tag $tag does not exist; creating a new private draft release and tag."
          gh release create $tag @assets --repo '${{ github.repository }}' --target '${{ github.sha }}' --title "WDForceStereo v$version" --generate-notes --draft
