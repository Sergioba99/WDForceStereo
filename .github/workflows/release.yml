name: Publish WDForceStereo Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version/tag (for example v1.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ inputs.version }}'
          } else {
            $tag = '${{ github.ref_name }}'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Build kernel32 import library
        shell: pwsh
        run: lld-link /lib /machine:x64 /def:kernel32.def /out:kernel32.lib

      - name: Compile
        shell: pwsh
        run: >-
          clang --target=x86_64-pc-windows-msvc -c src/wd_force_stereo.c
          -o wd_force_stereo.obj -O2 -ffreestanding -fno-builtin
          -fno-stack-protector -Wno-incompatible-library-redeclaration

      - name: Link
        shell: pwsh
        run: >-
          lld-link /dll /machine:x64 /entry:DllMain /nodefaultlib
          wd_force_stereo.obj kernel32.lib
          /def:src/exports.def /out:dinput8.dll

      - name: Stage release package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $folder = "WDForceStereo-v$version"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item .\dinput8.dll "$folder\dinput8.dll"
          Copy-Item .\release\WDForceStereo.ini "$folder\WDForceStereo.ini"
          Copy-Item .\README.md "$folder\README.md"
          Copy-Item .\LICENSE "$folder\LICENSE"
          Compress-Archive -Path "$folder\*" -DestinationPath "WDForceStereo-v$version.zip" -Force
          Get-FileHash .\dinput8.dll -Algorithm SHA256 | Format-List
          Get-FileHash ".\WDForceStereo-v$version.zip" -Algorithm SHA256 | Format-List

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $version = '${{ steps.version.outputs.version }}'
          gh release create $tag `
            ".\WDForceStereo-v$version.zip#WDForceStereo v$version" `
            ".\dinput8.dll#dinput8.dll" `
            ".\release\WDForceStereo.ini#WDForceStereo.ini" `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title "WDForceStereo v$version" `
            --generate-notes
