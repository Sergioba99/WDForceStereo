name: WDForceStereo Test Build

on:
  workflow_dispatch:

jobs:
  test-build:
    runs-on: windows-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Build kernel32 import library
        shell: pwsh
        run: lld-link /lib /machine:x64 /def:kernel32.def /out:kernel32.lib

      - name: Compile optimized WDForceStereo core
        shell: pwsh
        run: >-
          clang --target=x86_64-pc-windows-msvc -c src/wd_core.c
          -o wd_core.obj -O2 -ffreestanding -fno-builtin
          -fno-stack-protector -Wno-incompatible-library-redeclaration

      - name: Compile DInput8 proxy layer
        shell: pwsh
        run: >-
          clang --target=x86_64-pc-windows-msvc -c src/dinput8_proxy.c
          -o dinput8_proxy.obj -O2 -ffreestanding -fno-builtin
          -fno-stack-protector -Wno-incompatible-library-redeclaration

      - name: Compile complete WinMM proxy layer
        shell: pwsh
        run: >-
          clang --target=x86_64-pc-windows-msvc -c src/winmm_proxy.c
          -o winmm_proxy.obj -O2 -ffreestanding -fno-builtin
          -fno-stack-protector -Wno-incompatible-library-redeclaration

      - name: Compile dedicated ASI entry
        shell: pwsh
        run: >-
          clang --target=x86_64-pc-windows-msvc -c src/asi_entry.c
          -o asi_entry.obj -O2 -ffreestanding -fno-builtin
          -fno-stack-protector -Wno-incompatible-library-redeclaration

      - name: Link DInput8 proxy
        shell: pwsh
        run: >-
          lld-link /dll /machine:x64 /entry:DllMain /nodefaultlib /opt:ref
          wd_core.obj dinput8_proxy.obj kernel32.lib
          /def:src/exports.def /out:dinput8.dll

      - name: Link WinMM proxy
        shell: pwsh
        run: >-
          lld-link /dll /machine:x64 /entry:DllMain /nodefaultlib /opt:ref
          wd_core.obj winmm_proxy.obj kernel32.lib
          /def:src/winmm_exports.def /out:winmm.dll

      - name: Link ASI plugin
        shell: pwsh
        run: >-
          lld-link /dll /machine:x64 /entry:DllMain /nodefaultlib /opt:ref
          wd_core.obj asi_entry.obj kernel32.lib
          /out:WDForceStereo.asi

      - name: Stage optimized-core regression artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-package | Out-Null
          Copy-Item .\dinput8.dll test-package\dinput8.dll
          Copy-Item .\winmm.dll test-package\winmm.dll
          Copy-Item .\WDForceStereo.asi test-package\WDForceStereo.asi
          Copy-Item .\release\WDForceStereo.ini test-package\WDForceStereo.ini
          git rev-parse --short HEAD | Out-File -Encoding ascii test-package\BUILD_COMMIT.txt
          @"
          TEST PURPOSE: optimized shared-core regression test.

          The audio behavior and INI semantics are intended to remain unchanged.
          This build removes obsolete diagnostic state, redundant source-voice
          hooks/state, duplicated path storage, redundant log file operations,
          and unnecessary dynamic kernel32 lookup while keeping all three loader
          routes independent.

          Test each route separately:
          - dinput8.dll standalone
          - winmm.dll with NexusTools' dinput8.dll
          - WDForceStereo.asi with NexusTools

          Do not install more than one WDForceStereo loader at the same time.
          "@ | Out-File -Encoding ascii test-package\TEST_README.txt

      - name: Show SHA256
        shell: pwsh
        run: |
          Get-FileHash .\dinput8.dll -Algorithm SHA256
          Get-FileHash .\winmm.dll -Algorithm SHA256
          Get-FileHash .\WDForceStereo.asi -Algorithm SHA256

      - name: Upload temporary test artifact
        uses: actions/upload-artifact@v4
        with:
          name: WDForceStereo-optimized-core-test
          path: test-package/
          if-no-files-found: error
          retention-days: 7
