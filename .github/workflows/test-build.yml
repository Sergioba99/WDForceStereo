name: WDForceStereo Test Build

on:
  workflow_dispatch:

jobs:
  test-build:
    runs-on: windows-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Build kernel32 import library
        shell: pwsh
        run: lld-link /lib /machine:x64 /def:kernel32.def /out:kernel32.lib

      - name: Compile current test source
        shell: pwsh
        run: >-
          clang --target=x86_64-pc-windows-msvc -c src/wd_force_stereo.c
          -o wd_force_stereo.obj -O2 -ffreestanding -fno-builtin
          -fno-stack-protector -Wno-incompatible-library-redeclaration

      - name: Link current standalone test DLL
        shell: pwsh
        run: >-
          lld-link /dll /machine:x64 /entry:DllMain /nodefaultlib
          wd_force_stereo.obj kernel32.lib
          /def:src/exports.def /out:dinput8.dll

      - name: Create current ASI test binary
        shell: pwsh
        run: Copy-Item .\dinput8.dll .\WDForceStereo.asi

      - name: Stage test artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-package | Out-Null
          Copy-Item .\dinput8.dll test-package\dinput8.dll
          Copy-Item .\WDForceStereo.asi test-package\WDForceStereo.asi
          Copy-Item .\release\WDForceStereo.ini test-package\WDForceStereo.ini
          if (Test-Path .\release\INSTALL.txt) {
            Copy-Item .\release\INSTALL.txt test-package\INSTALL.txt
          }
          git rev-parse --short HEAD | Out-File -Encoding ascii test-package\BUILD_COMMIT.txt

      - name: Upload temporary test artifact
        uses: actions/upload-artifact@v4
        with:
          name: WDForceStereo-test
          path: test-package/
          if-no-files-found: error
          retention-days: 7
