name: Build WDForceStereo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: One-time source cleanup and INI self-healing
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $path = 'src/wd_force_stereo.c'
          $s = Get-Content $path -Raw

          if ($s -notmatch 'WriteDefaultConfigIfMissing') {
            $s = $s.Replace('#define OPEN_ALWAYS 4', "#define OPEN_ALWAYS 4`r`n#define CREATE_ALWAYS 2`r`n#define GENERIC_WRITE 0x40000000`r`n#define INVALID_FILE_ATTRIBUTES 0xFFFFFFFF")
            $s = $s.Replace('__declspec(dllimport) DWORD WINAPI SetFilePointer(HANDLE, LONG, LONG*, DWORD);', "__declspec(dllimport) DWORD WINAPI SetFilePointer(HANDLE, LONG, LONG*, DWORD);`r`n__declspec(dllimport) DWORD WINAPI GetFileAttributesW(LPCWSTR);")

            $needle = 'typedef DWORD (WINAPI *PFN_GetPrivateProfileStringW)(LPCWSTR,LPCWSTR,LPCWSTR,WCHAR*,DWORD,LPCWSTR);'
            $insert = @'
          typedef DWORD (WINAPI *PFN_GetPrivateProfileStringW)(LPCWSTR,LPCWSTR,LPCWSTR,WCHAR*,DWORD,LPCWSTR);

          static void WriteDefaultConfigIfMissing(void)
          {
              static const CHAR defaultIni[] =
                  "; WDForceStereo configuration\r\n"
                  "; This file is recreated automatically if it is missing.\r\n"
                  "; Edit values, save, and restart Watch Dogs.\r\n"
                  "\r\n"
                  "[Audio]\r\n"
                  "; Front left/right gain\r\n"
                  "FrontGain=1.000\r\n"
                  "; Dialogue/front-center gain\r\n"
                  "CenterGain=1.000\r\n"
                  "; Rear/surround fold-down gain\r\n"
                  "SurroundGain=0.000\r\n"
                  "; Subwoofer/LFE fold-down gain\r\n"
                  "LFEGain=0.000\r\n"
                  "; Final global multiplier\r\n"
                  "MasterGain=1.000\r\n"
                  "\r\n"
                  "[Debug]\r\n"
                  "; 1 = create WDForceStereo.log, 0 = disable logging\r\n"
                  "Log=1\r\n";
              HANDLE file;
              DWORD written = 0;

              if (!g_iniPath[0]) BuildPaths();
              if (GetFileAttributesW(g_iniPath) != INVALID_FILE_ATTRIBUTES) return;

              file = CreateFileW(g_iniPath, GENERIC_WRITE, FILE_SHARE_READ, NULL,
                                 CREATE_ALWAYS, FILE_ATTRIBUTE_NORMAL, NULL);
              if (file == INVALID_HANDLE_VALUE) {
                  LogLine("WARNING: WDForceStereo.ini is missing and could not be recreated.");
                  return;
              }

              WriteFile(file, defaultIni, (DWORD)(sizeof(defaultIni) - 1), &written, NULL);
              CloseHandle(file);
              LogLine("WDForceStereo.ini missing; recreated with default values.");
          }
          '@
            $s = $s.Replace($needle, $insert.Trim())
            $s = $s.Replace('if(!g_iniPath[0])BuildPaths();`r`n    k=GetModuleHandleW', 'if(!g_iniPath[0])BuildPaths();`r`n    WriteDefaultConfigIfMissing();`r`n    k=GetModuleHandleW')
            if ($s -notmatch 'WriteDefaultConfigIfMissing\(\);\s*k=GetModuleHandleW') {
              $s = $s.Replace('if(!g_iniPath[0])BuildPaths();`n    k=GetModuleHandleW', 'if(!g_iniPath[0])BuildPaths();`n    WriteDefaultConfigIfMissing();`n    k=GetModuleHandleW')
            }
          }

          $renames = @{
            'AS(' = 'AppendString('
            'AC(' = 'AppendChar('
            'AU(' = 'AppendUInt('
            'AH(' = 'AppendHex32('
            'AP(' = 'AppendPointer('
            'AF3(' = 'AppendFloat3('
            'EngineInfo(' = 'FindEngineInfo('
            'VoiceInfo(' = 'FindVoiceInfo('
            'VtblInfo(' = 'FindVtableHook('
            'LogSource(' = 'LogSourceVoiceCreation('
            'DestChannelsFor(' = 'ResolveDestinationChannels('
          }
          foreach ($key in $renames.Keys) { $s = $s.Replace($key, $renames[$key]) }

          [IO.File]::WriteAllText((Join-Path $PWD $path), $s, [Text.UTF8Encoding]::new($false))
          clang-format -i $path

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $path
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Refactor source and make INI self-healing'
            git push
          }

      - name: Build kernel32 import library
        shell: pwsh
        run: lld-link /lib /machine:x64 /def:kernel32.def /out:kernel32.lib

      - name: Compile
        shell: pwsh
        run: >-
          clang --target=x86_64-pc-windows-msvc -c src/wd_force_stereo.c
          -o wd_force_stereo.obj -O2 -ffreestanding -fno-builtin
          -fno-stack-protector -Wno-incompatible-library-redeclaration

      - name: Link
        shell: pwsh
        run: >-
          lld-link /dll /machine:x64 /entry:DllMain /nodefaultlib
          wd_force_stereo.obj kernel32.lib
          /def:src/exports.def /out:dinput8.dll

      - name: Show SHA256
        shell: pwsh
        run: Get-FileHash .\dinput8.dll -Algorithm SHA256

      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item .\dinput8.dll package\dinput8.dll
          Copy-Item .\release\WDForceStereo.ini package\WDForceStereo.ini
          Copy-Item .\README.md package\README.md
          Copy-Item .\LICENSE package\LICENSE

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: WDForceStereo-v1.2
          path: package/
          if-no-files-found: error
