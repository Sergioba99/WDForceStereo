name: Build WDForceStereo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build kernel32 import library
        shell: pwsh
        run: lld-link /lib /machine:x64 /def:kernel32.def /out:kernel32.lib

      - name: Compile
        shell: pwsh
        run: >-
          clang --target=x86_64-pc-windows-msvc -c src/wd_force_stereo.c
          -o wd_force_stereo.obj -O2 -ffreestanding -fno-builtin
          -fno-stack-protector -Wno-incompatible-library-redeclaration

      - name: Link
        shell: pwsh
        run: >-
          lld-link /dll /machine:x64 /entry:DllMain /nodefaultlib
          wd_force_stereo.obj kernel32.lib
          /def:src/exports.def /out:dinput8.dll

      - name: Show SHA256
        shell: pwsh
        run: Get-FileHash .\dinput8.dll -Algorithm SHA256

      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item .\dinput8.dll package\dinput8.dll
          Copy-Item .\release\WDForceStereo.ini package\WDForceStereo.ini
          Copy-Item .\README.md package\README.md
          Copy-Item .\LICENSE package\LICENSE

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: WDForceStereo-v1.2
          path: package/
          if-no-files-found: error
